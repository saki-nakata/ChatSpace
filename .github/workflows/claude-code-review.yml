name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# 同じPRに連続でプッシュされた場合、実行中のレビューを打ち切って最新の差分のみをレビューする
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # フォークからのPRではシークレットが渡されないため実行しない
    # ドラフトPRは Ready for review になるまでレビューしない
    # DependabotのPRも実行しない: GitHubはDependabot起因のワークフローに通常のSecretsを渡さず、
    # 別枠の「Dependabot secrets」を使う仕様のため、CLAUDE_CODE_OAUTH_TOKENが空文字になり
    # Claude Code Actionが即座に失敗する(フォークからのPRと同じ理由)。依存バージョンの数値変更に
    # AIレビューは要らず、必須チェックである backend-build / frontend-build は正常に動作する
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # PRの既存コメントを含むコンテキストを保持し、進捗をコメントに表示する
          track_progress: true
          # プッシュのたびにコメントが増えないよう、1つのコメントを更新し続ける
          use_sticky_comment: true

          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            このリポジトリはSlack風チャットアプリケーション（ワークスペース／チャンネル／DM／スレッド／管理者権限を持つマルチテナント構成）です。
            以下の手順でプルリクエストをレビューしてください。

            ## レビュー手順

            ### ステップ1：過去のレビュー確認（重複指摘の防止）
            1. このプルリクエストの過去のレビューコメントを確認する
            2. 対応済みの項目は再指摘しない
            3. 新規変更または未対応の項目のみをレビュー対象とする

            ### ステップ2：変更ファイルの理解
            - 変更の意図（新機能、バグ修正、リファクタリングなど）
            - 影響範囲
            - プルリクエストの説明との適合性

            ### ステップ3：レビュー実施

            #### フロントエンド（React／TypeScript、`apps/web`）の変更がある場合
            - [ ] 型が `any` で潰されていないか、`@ts-ignore`/`@ts-expect-error` で握り潰していないか
            - [ ] マークダウン描画箇所で `DOMPurify` を通さずに `dangerouslySetInnerHTML` を使っていないか
            - [ ] ユーザー入力・APIレスポンスをそのままHTMLとして描画していないか（XSS）
            - [ ] コンソールログがデバッグ用途で残っていないか
            - [ ] アクセシビリティの基本対応（キーボード操作、フォーカス管理、ラベル）ができているか
            - [ ] WebSocket（STOMP）の購読がコンポーネントの unmount 時に解除されているか（リーク防止）

            #### バックエンド（Java／Spring Boot、`apps/api`）の変更がある場合
            - [ ] Controller が Repository を直接呼んでいないか（層飛ばし禁止。ArchUnitテストでも自動検証されるが、目視でも確認する）
            - [ ] Service に `HttpServletRequest` 等のHTTP概念が持ち込まれていないか
            - [ ] JPA エンティティをそのままAPIレスポンス（Controllerの戻り値）として返していないか（DTO変換の有無）
            - [ ] `@Transactional` の境界が適切か（private メソッド・同一クラス内の自己呼び出しでプロキシが効かず無効化されていないか）
            - [ ] `@OneToMany`/`@ManyToOne` が意図せず EAGER になっていないか、ループ内クエリ等で N+1 が発生していないか
            - [ ] リクエストDTOに Bean Validation（`@NotBlank`/`@Size`/`@Pattern` 等）が付与されているか
            - [ ] Flyway マイグレーションで、**適用済みの既存ファイルを改変していないか**（変更が必要な場合は新しい番号のファイルを追加しているか）
            - [ ] `spring.jpa.hibernate.ddl-auto` が `update`/`create`/`create-drop` になっていないか（`none` かつ Flyway 管理を維持）
            - [ ] 新しい STOMP 宛先を追加した場合、SEND/SUBSCRIBE のホワイトリスト（default-deny設定）と `StompDestinations.java`／フロントエンドの `destinations.ts` の両方を更新しているか（同期漏れがないか）
            - [ ] キック時の強制切断処理が `@TransactionalEventListener(phase = AFTER_COMMIT)` 等、コミット確定後にのみ実行される設計を維持しているか

            #### アプリケーションコード（サーバーサイド・API・DB）の変更がある場合
            - [ ] バグ・ロジックの誤り、エッジケースの考慮漏れがないか
            - [ ] 入力値の検証が行われているか
            - [ ] オーナー限定操作（ユーザーのキック、チャンネルの追加・削除、ユーザー招待）を一般メンバーが実行できてしまわないか
            - [ ] プライベートチャンネル・DM・スレッドの内容や存在が、参加していないユーザーに閲覧・検索・通知経由で漏れないか
            - [ ] メッセージ検索・メンション通知が、アクセス権のないチャンネル／DMの内容を結果に含めていないか
            - [ ] DM・チャンネルへのアクセス判定で、リソース参加者チェックだけでなく「現在も当該ワークスペースのメンバーであるか」を再確認しているか（ワークスペースをキックされてもDM等の既知IDでアクセスが残り続けるケースがある）
            - [ ] 通知の取得・未読件数・既読化（個別・全件）の全エンドポイントに同一のスコープ条件が適用されているか（一覧からは消えるのに未読数には残る、といった不整合がないか）
            - [ ] 権限スコープの絞り込みで複数条件を組み合わせる場合、意図せず `OR` で結合されて絞り込みが無効化されていないか（`AND` で結合すべき条件が緩んでいないか）
            - [ ] `messageId`/`channelId`/`dmId` を受け取るエンドポイントで、URLのスコープとリソースの実際の所属が一致することを検証しているか（confused-deputy対策）
            - [ ] ソフトデリート対象の扱いが tombstone 方式と一致しているか(**検索クエリのみ** `deletedAt IS NULL` で除外し、一覧・スレッド・コンテキスト取得は削除済み行を除外せず本文を伏せて返す設計。一覧系エンドポイントで誤って除外していないか、逆に検索で除外し忘れていないかの両方を確認。メッセージング機能定義書§3.3・§6.3参照)
            - [ ] 添付ファイル（画像・動画）のアップロードでファイル種別・サイズ検証やパストラバーサル対策が抜けていないか
            - [ ] マークダウン描画箇所でXSS（スクリプト注入）が起こり得ないか
            - [ ] N+1クエリなど、明らかなパフォーマンス上の問題がないか

            #### ドキュメントの変更がある場合
            - [ ] ドキュメント間の整合性がとれているか
            - [ ] Markdownのフォーマットが正しいか
            - [ ] 内容が正確か
            - [ ] リンク切れがないか

            #### ワークフローの変更がある場合
            - [ ] YAML構文が正しいか
            - [ ] パーミッション設定が最小権限の原則に従っているか
            - [ ] シークレットの取り扱いが適切か

            ### ステップ4：レビュー結果の出力

            **問題なしと判断した項目は出力しないでください。**
            実際に修正が必要な指摘事項、または改善提案がある項目のみ出力してください。

            #### フィードバック形式

            ##### 必須修正事項
            問題点と具体的な修正方法を記載する。

            ##### 推奨改善事項
            より良い実装方法の提案。

            ##### 軽微な提案
            タイポ、表現改善など。

            ## 注意事項
            - **レビューは日本語で行ってください。**
            - **具体的で建設的な提案をしてください。**
            - **問題なしと判断した項目は出力しないでください。**
            - コード行に紐づく指摘は該当行へのインラインコメントで、全体の総評はトップレベルのコメントで投稿してください。
            - 指摘事項が一つもない場合は、その旨だけを簡潔にコメントしてください。

          # --max-turns: 30ではPRの規模によっては足りず、レビューを投稿し終えた後に
          # 「上限超過」でジョブだけが失敗扱いになる(PR #8で発生: 40ターン使用、is_error=false)。
          # レビュー内容は正常に投稿されているのに赤くなるため上限を引き上げる。
          # 注意: claude_args はリテラルブロックのため、この位置(キーの外)にコメントを書くこと。
          # ブロック内に書くと "#..." がそのままCLI引数として渡ってしまう。
          claude_args: |
            --max-turns 60
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
