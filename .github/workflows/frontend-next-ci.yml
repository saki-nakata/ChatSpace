name: Frontend CI (apps/web-next)

on:
  pull_request:
    paths:
      - "apps/web-next/**"
      - ".github/workflows/frontend-next-ci.yml"
  push:
    branches: [main]
    paths:
      - "apps/web-next/**"
      - ".github/workflows/frontend-next-ci.yml"

concurrency:
  group: frontend-next-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web-next
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # pnpm run <script> はスクリプト名を1つしか取らないため個別に実行する
      # (計画書のレビュー指摘: typecheck lint build と空白区切りで並べると動作しない)
      - name: Type check
        run: pnpm --filter @chatspace/web-next run typecheck

      - name: Lint (warnings not allowed)
        run: pnpm --filter @chatspace/web-next run lint

      - name: Build
        run: pnpm --filter @chatspace/web-next run build

      # STOMP宛先契約テスト(AUTH-N18)がapps/api-javaの出力するJSONと突き合わせるため、
      # フロントエンドのテストを実行する前にバックエンドをビルドしてJSONを生成しておく
      - name: Set up JDK 21 (for STOMP destinations contract test)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('apps/api-java/**/*.gradle*', 'apps/api-java/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Export STOMP destinations JSON (apps/api-java)
        working-directory: apps/api-java
        run: ./gradlew exportStompDestinations --console=plain

      - name: Test (STOMP destinations contract test)
        run: pnpm --filter @chatspace/web-next run test
