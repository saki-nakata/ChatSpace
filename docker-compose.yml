# ローカル開発用。単一インスタンス前提のためPostgreSQLのみを起動する。
# 水平スケール対応は検討したが実施しないことが確定しているため、Redis・RabbitMQは追加しない
# (詳細は docs/インフラ構成書.md参照)。
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: chatspace
      POSTGRES_USER: chatspace
      POSTGRES_PASSWORD: chatspace
    ports:
      - "5432:5432"
    volumes:
      - chatspace-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatspace -d chatspace"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  chatspace-postgres-data:
