packages:
  - "apps/web"
allowBuilds:
  esbuild: true
minimumReleaseAgeExclude:
  - globals@17.11.0
overrides:
  # vitestの任意ピア依存としてvite自体も引き込まれるが、pnpmのピア解決が古い方(脆弱版)に
  # 寄ってしまい直接依存の新しいviteと重複解決される(Dependabot alert #1・3・4・6・8・9対応)。
  # 全経路で最新版に強制統一する。
  vite: ">=6.4.3"
  # viteが設定ファイル読み込みに使うtsx(transitive)が古いesbuildを固定しているため
  # (Dependabot alert #5対応)、esbuildも全経路で修正版に強制統一する。
  esbuild: ">=0.25.0"
